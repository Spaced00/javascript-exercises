<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>


        function capitalize(someText) {
            const lower = someText.toLowerCase();
            return lower.charAt(0).toUpperCase() + lower.slice(1);    
        }
        
        console.log(capitalize("DSAFKLJDSFsdkfjsdvksdnfsadkljf"))
        
        function lastLetter(someString) {
            const last = someString.at(-1)
            return last
        }

        console.log(lastLetter("asdklfsvcakmasdkjf"))

    </script>
</body>
</html>
